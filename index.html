<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: stacked list of match rows grouped under two headings, with a sticky club-green header */
:root{
  --bg:#f6f8f6; --surface:#ffffff; --border:#dfe6df;
  --green:#1c6b32; --green-dark:#154f26; --text:#1c2420; --muted:#6b7a6f;
  --us:#12421f; --score:#1c6b32; --vs:#9aa89d;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10150f; --surface:#171d16; --border:#283428;
    --green:#3fae63; --green-dark:#2f8a4d; --text:#e7ede6; --muted:#8fa090;
    --us:#7adba0; --score:#5fc985; --vs:#5d6b60;
  }
}
:root[data-theme="dark"]{
  --bg:#10150f; --surface:#171d16; --border:#283428;
  --green:#3fae63; --green-dark:#2f8a4d; --text:#e7ede6; --muted:#8fa090;
  --us:#7adba0; --score:#5fc985; --vs:#5d6b60;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
body::before{
  content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px);
  z-index:10; background:var(--green-dark);
}
header.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
  background:var(--green-dark); color:#fff; margin:0 -16px;
  padding:14px max(16px, env(safe-area-inset-left,0px)) 14px max(16px, env(safe-area-inset-right,0px));
  display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap;
}
header.top h1{font-size:1.15rem; margin:0; letter-spacing:.02em}
header.top .src{font-size:.72rem; opacity:.85}
main{max-width:640px; margin:0 auto; padding-bottom:40px}
.updated{font-size:.82rem; color:var(--muted); margin:14px 0 20px}
.block-title{
  font-size:1.05rem; font-weight:700; color:var(--green);
  border-bottom:2px solid var(--green); padding-bottom:6px; margin:0 0 4px;
}
.upcoming-header{
  display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px;
  border-bottom:2px solid var(--green); padding-bottom:6px; margin:0 0 4px;
}
.upcoming-header .block-title{border-bottom:none; margin:0; padding-bottom:0}
.week-nav{display:flex; align-items:center; gap:10px}
.week-nav button{
  background:var(--green); color:#fff; border:none; border-radius:6px;
  width:2em; height:2em; font-size:1.1em; line-height:1; cursor:pointer;
}
.week-nav button:active{opacity:.8}
.week-label{font-size:.82rem; color:var(--muted); min-width:11em; text-align:center}
.list{background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:28px}
.row{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; padding:11px 14px; border-top:1px solid var(--border)}
.row:first-child{border-top:none}
.cat{font-weight:600; min-width:100%; font-size:.78rem; color:var(--muted); text-transform:uppercase; letter-spacing:.03em}
.match{flex-grow:1; min-width:0; font-size:.98rem}
.us{font-weight:700; color:var(--us)}
.score{font-weight:700; color:var(--score); font-variant-numeric:tabular-nums; margin:0 2px}
.vs{color:var(--vs); margin:0 2px}
.date{font-size:.78rem; color:var(--muted); margin-left:auto; white-space:nowrap}
.empty{color:var(--muted); font-size:.85rem; font-style:italic}
footer.note{font-size:.72rem; color:var(--muted); text-align:center; padding:10px 0 20px}
</style>

<script>
(function(){
  var SNAPSHOT_AT = 'Ne 25. 10. 2026 19:00';
  var DATA = JSON.parse(document.getElementById('sko-data').textContent);
  var DAY_NAMES = ['Ne','Po','Út','St','Čt','Pá','So'];

  document.getElementById('updated').textContent = 'Snímek dat: ' + SNAPSHOT_AT + ' (zdroj: IS FAČR via skobrany.cz)';

  function pad(n){ return String(n).padStart(2,'0'); }
  function fmtDate(d){ return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'; }
  function fmtDateTime(d){ return DAY_NAMES[d.getDay()]+' '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'. '+pad(d.getHours())+':'+pad(d.getMinutes()); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function teamSpan(name){
    var isUs = name.indexOf('Obřany') === 0;
    return '<span class="'+(isUs?'us':'')+'">'+esc(name)+'</span>';
  }
  function matchLine(m){
    return m.score
      ? teamSpan(m.home)+' <span class="score">'+esc(m.score)+'</span> '+teamSpan(m.away)
      : teamSpan(m.home)+' <span class="vs">–</span> '+teamSpan(m.away);
  }
  function row(cat, lineHtml, dateText){
    return '<div class="row"><span class="cat">'+esc(cat)+'</span>'+
      '<span class="match">'+lineHtml+'</span>'+
      '<span class="date">'+esc(dateText)+'</span></div>';
  }
  function emptyRow(cat, text){
    return '<div class="row"><span class="cat">'+esc(cat)+'</span><span class="empty">'+text+'</span></div>';
  }

  // Poslední zápasy: most recent match with a score, per category
  var lastRows = DATA.map(function(cat){
    var played = cat.matches.filter(function(m){ return m.score; });
    if(!played.length) return emptyRow(cat.name, 'žádné odehrané zápasy');
    var m = played[played.length - 1];
    var d = new Date(m.date);
    return row(cat.name, matchLine(m), fmtDateTime(d));
  });
  document.getElementById('last-list').innerHTML = lastRows.join('');

  // Týdenní přehled
  var offset = 0;
  function mondayOf(date){
    var d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    var day = d.getDay();
    var diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return d;
  }
  function weekBounds(){
    var start = mondayOf(new Date());
    start.setDate(start.getDate() + offset*7);
    var end = new Date(start);
    end.setDate(end.getDate()+7);
    return {start:start, end:end};
  }
  function renderWeek(){
    var b = weekBounds();
    var endInclusive = new Date(b.end.getTime()-1);
    document.getElementById('week-label').textContent =
      (offset===0 ? 'Tento týden ' : '') + fmtDate(b.start) + ' – ' + fmtDate(endInclusive);

    var rows = [];
    DATA.forEach(function(cat){
      var matches = cat.matches.filter(function(m){
        var d = new Date(m.date);
        return d >= b.start && d < b.end;
      });
      if(!matches.length){
        rows.push(emptyRow(cat.name, 'v tomto týdnu se nehraje'));
      } else {
        matches.forEach(function(m){
          var d = new Date(m.date);
          rows.push(row(cat.name, matchLine(m), fmtDateTime(d)));
        });
      }
    });
    document.getElementById('week-list').innerHTML = rows.join('');
  }
  document.getElementById('prev').addEventListener('click', function(){ offset -= 1; renderWeek(); });
  document.getElementById('next').addEventListener('click', function(){ offset += 1; renderWeek(); });
  renderWeek();
})();
</script>
